name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Lock the flake (adds missing inputs only, never updates existing ones)
        run: nix flake lock

      - name: Shell syntax and lint
        run: |
          bash -n bootstrap.sh rebuild.sh
          nix run --inputs-from . nixpkgs#shellcheck -- -S error bootstrap.sh rebuild.sh

      - name: Evaluate the system without building it
        run: nix build .#darwinConfigurations.mac.system --dry-run

      - name: Commit flake.lock when new or changed
        if: github.event_name != 'pull_request'
        run: |
          if git ls-files --error-unmatch flake.lock >/dev/null 2>&1 && git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "ci: lock flake inputs"
          git push
